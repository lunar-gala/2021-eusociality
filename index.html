<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ff8a01" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Lunar Gala 2021: COLLECTIVA — a fashion show theme site exploring interdependence and eusociality."
    />
    <title>LG 2021: COLLECTIVA</title>

    <!--
      Google Analytics (GA4).
      Replace `G-XXXXXXXXXX` with your Measurement ID to enable tracking.
      Leave as-is (or delete) to disable analytics.
    -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
  </head>
  <body style="margin:0;background:#000;color:#fff">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!--
        Pre-React loading indicator. Renders instantly from raw HTML before
        any JS bundle arrives. React's createRoot().render() replaces the
        innerHTML of #root, so this disappears automatically — no cleanup.
      -->
      <style>
        @keyframes pre-pulse {
          0%, 100% { opacity: 0.25; }
          50% { opacity: 1; }
        }
        @keyframes pre-grow {
          from { width: 0; }
          to { width: 100%; }
        }
        #pre-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          font-family: 'Sprat Type Condensed', Georgia, serif;
          color: #fff;
          user-select: none;
        }
        #pre-loader .pre-title {
          font-size: clamp(32px, 10vw, 120px);
          font-weight: 100;
          letter-spacing: -0.12em;
          animation: pre-pulse 2.5s ease-in-out infinite;
        }
        #pre-loader .pre-bar {
          margin-top: 24px;
          width: min(200px, 40vw);
          height: 1px;
          background: rgba(255,255,255,0.15);
          border-radius: 1px;
          overflow: hidden;
        }
        #pre-loader .pre-bar-fill {
          height: 100%;
          background: #fff;
          animation: pre-grow 3s ease-in-out infinite;
        }
      </style>
      <div id="pre-loader">
        <div class="pre-title">COLLECTIVA</div>
        <div class="pre-bar"><div class="pre-bar-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
